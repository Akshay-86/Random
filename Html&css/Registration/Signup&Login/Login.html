<!DOCTYPE html>
<head>
  <title>Login</title>
  <style>
    .con{
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>
  <h3 align="center">Login</h3>
  <div class="con">
    <table>
      <tr align="left">
        <th><label for="nam">Username</label></th>
        <td><input type="text" id="nam" placeholder="Enter Username"></td>
      </tr>
      <tr align="left">
        <th><label for="pas">Password</label></th>
        <td><input type="password" form="pas" placeholder="Enter Password"></td>
      </tr>
      <tr>
        <td colspan="2" align="center"><button>Login</button></td>
      </tr>
      <tr>
        <td colspan="2" align="center">Don't have an account <a href="Signup.html">Sign up</a></td>
      </tr>
    </table>
  </div>
</body>
