<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="New.css">
  </head>
  <body>
    <div class="bd"></div>
    <div class="for">
      <h1 align="center">Signup</h1>
      <form>
        <fieldset>
          <legend>User_info</legend>
          <table>
            <tr>
              <th align="left"><label for="nam">Enter Full Name:</label></th>
              <td><input class="name" type="text" id="nam"></td>
            </tr>
            <tr>
              <th align="left"><label for="mal">Enter E-mail:</label></th>
              <td><input class="mail" type="email" id="mal"></td>
            </tr>
            <tr>
              <th align="left"><label for="pas">Enter Password:</label></th>
              <td><input class="pas" type="password" id="pas"></td>
            </tr>
            <tr>
              <th align="left"><label for="conpas">Conform Password:</label></th>
              <td><input class="conpas" type="password" id="conpas"></td>
            </tr>
            <tr class="tr">
              <th align="left"><label for="gen">Select Gender:</label></th>
              <td>
                <label>
                <input class="mal" type="radio" name="gender" id="gen">
                <span></span><p>Male</p>
                </label>
                <label>
                 <input type="radio" name="gender">
                 <span></span><p>Female</p>
                </label>
              </td>
            </tr>
            <tr>
              <th align="left"><label for="add">Enter Address:</label></th>
              <td><textarea cols="22" rows="3" id="add"></textarea></td>
            </tr>
            <tr>
              <th align="left"><label>Select District:</label></th>
              <td>
                <select>
                <optgroup label="Ap">
                  <option>Eluru</option>
                  <option>Kakinada</option>
                  <option>Guntur</option>
                </optgroup>
                <optgroup label="Ts">
                  <option>Hydrabad</option>
                  <option>Peta</option>
                </optgroup>
              </select>
              </td>
            </tr>
          </table>
        </fieldset>
      </form>
    </div>
  </body>
  
</html>
