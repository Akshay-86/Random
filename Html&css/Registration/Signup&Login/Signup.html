<!DOCTYPE html>
<head>
  <title>Document</title>
  <style>
    .con{
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>
  <h3 align="center">Sign up</h3>
  <div class="con">
    <table>
      <tr>
        <th align="left"><label for="fnam">Full Name</label></th>
        <td><input type="text" id="fnam" placeholder="Enter Full Name"></td>
      </tr>
      <tr>
        <th align="left"><label for="lnam">User Name</label></th>
        <td><input type="text" id="lnam" placeholder="Enter Username"></td>
      </tr>
      <tr>
        <th align="left"><label for="mal">Email</label></th>
        <td><input type="mail" id="mal" placeholder="Enter Email"></td>
      </tr>
      <tr>
        <th align="left"><label for="pas">Password</label></th>
        <td><input type="password" id="pas" placeholder="Enter Password"></td>
      </tr>
      <tr>
        <td colspan="2" align="center"><button>Sign up</button></td>
      </tr>
      <tr>
        <td colspan="2" align="center">Already have an account ? <a href="Login.html">Login</a></td>
      </tr>
    </table>
  </div>
</body>
</html>
