<!DOCTYPE html>
<html>
  <head>
    <style>
      .con{
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        column-gap: 20px;
      }
      
      img{
        width: 100%;
      }
      
      button{
        background-color: blue;
        color:white;
        border:none;
        border-radius:2px;
        padding: 4px 6px;
      }
      
      .imgco{
        display: grid;
        grid-template-columns: 20px 1fr;
        align-items: center;
      }
      
      .imgco div img{
        width: 100%;
        height: 20px;
        object-fit: cover;
        border-radius: 50%;
      }
      
      .cont{
        box-shadow: 5px 5px 10px rgba(0,0,0,0.15);
      }
      
      .nam,.imgco,.butt,.frds{
        margin-left: 5px;
      }
      
      .butt{
        margin-bottom: 8px;
      }
      
    </style>
  </head>
  <body>
    <div class="con">
      <div class="cont">
        <div>
          <img src="image3.jpg">
        </div>
        <div class="nam"><b>Oliver</b></div>
        <div class="imgco">
          <div><img src="image3.jpg"></div>
          <div class="frds">2 Mutual Frds</div>
        </div>
        <div class="butt"><button>Add Friend</button></div>
      </div>
      
      <div class="cont">
        <div>
          <img src="image3.jpg">
        </div>
        <div class="nam"><b>Mimi</b></div>
        <div class="imgco">
          <div><img src="image3.jpg"></div>
          <div class="frds">3 Mutual Frds</div>
        </div>
        <div class="butt"><button>Add Friend</button></div>
      </div>
      
      <div class="cont">
        <div>
          <img src="image3.jpg">
        </div>
        <div class="nam"><b>Rex</b></div>
        <div class="imgco">
          <div><img src="image3.jpg"></div>
          <div class="frds">4 Mutual Frds</div>
          </div>
        <div class="butt"><button>Add Friend</button></div>
      </div>
    </div>
  </body>
</html>
